<!doctype html><meta charset="utf-8"><title>weapon bench</title>
<style>html,body{margin:0;background:#20242b;overflow:hidden}canvas{display:block}
#l{position:fixed;left:8px;top:8px;color:#dfe6ef;font:11px/1.45 monospace;white-space:pre;z-index:9;text-shadow:0 1px 2px #000}</style>
<div id="l">loading…</div>
<!--
  PLAN-WEAPONS: the weapons in the hand, from four angles (front, the player's right, behind,
  the player's left), one row per pose. The figure runs the game's own update (figure.mjs) with
  the game's weapon rig (weapon-mesh.mjs), so this is the pose the game draws.

  Serve the repository root over HTTP (any static server) and open
  /qa/gta-upgrade/weaponbench.html. `?pose=katana-cut` renders one pose, larger. The measured
  numbers under each row are what the tests in tests/weapons.test.mjs assert on.
  `node qa/gta-upgrade/weaponbench-capture.mjs` saves the page as a PNG with its console.
-->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {humanoidCitizen} from '/src/player/character-asset.mjs';
import {createPlayerFigure} from '/src/player/figure.mjs';
import {SWORD} from '/src/player/attack-timing.mjs';
import {PALM} from '/src/player/weapons.mjs';

const report=await (await fetch('/public/data/character/citizen.json')).json();
const bytes=await (await fetch('/public/data/character/citizen.glb')).arrayBuffer();
const asset=humanoidCitizen(await new Promise((res,rej)=>new GLTFLoader().parse(bytes,'',res,rej)),report);
const only=new URLSearchParams(location.search).get('pose');
const dt=1/60;

/**
 * Each pose: what the player holds, and how to drive the figure into the frame to freeze.
 * `run(figure, state)` steps the game's update; the target, when there is one, is 6 m ahead.
 */
const POSES=[
 {id:'holstered',label:'fists: pistol at the hip, katana on the back',state:{weapon:'fists'},run(){}},
 {id:'katana-idle',label:'katana drawn, standing (Sword_Idle)',state:{weapon:'katana'},run(){}},
 {id:'katana-cut',label:`katana cut at its peak (${SWORD.peak}s of ${SWORD.duration}s)`,state:{weapon:'katana'},
  run(f,s){s.attackName='SwordAttack';s.attackDuration=s.attackTime=SWORD.duration;
   while(SWORD.duration-s.attackTime<SWORD.peak){f.update(s,dt);s.attackTime=Math.max(0,s.attackTime-dt);}}},
 // W2: the pistol. The target (the yellow ball) is 6 m ahead at chest height; the red line is the
 // muzzle ray, drawn to the target's distance.
 {id:'pistol-aim',label:'pistol aimed, standing',state:{weapon:'pistol',aim:1,aimHeading:0},run(f,s){for(let i=0;i<30;i++)f.update(s,dt);}},
 {id:'pistol-aim-walk',label:'pistol aimed while walking, target 45° left of the walk',
  state:{weapon:'pistol',aim:1,speed:1.4,aimHeading:Math.PI/4,aimTarget:{x:6*Math.sin(Math.PI/4),y:1.35,z:6*Math.cos(Math.PI/4)}},
  target:[6*Math.sin(Math.PI/4),1.35,6*Math.cos(Math.PI/4)],run(f,s){for(let i=0;i<47;i++)f.update(s,dt);}},
 {id:'pistol-shoot',label:'pistol shot, at the recoil (0.1 s in)',state:{weapon:'pistol',aim:1,aimHeading:0},
  run(f,s){for(let i=0;i<30;i++)f.update(s,dt);s.shotLeft=.633;for(let i=0;i<6;i++){f.update(s,dt);s.shotLeft-=dt;}}},
 {id:'pistol-reload',label:'pistol reload, half way',state:{weapon:'pistol'},
  run(f,s){s.reloadLeft=1.667;for(let i=0;i<50;i++){f.update(s,dt);s.reloadLeft-=dt;}}},
 // W3: an officer's revolver (the near-humanoid pool carries only this), aimed and fired.
 {id:'revolver-aim',label:'officer: revolver aimed (W3)',carry:['revolver'],state:{weapon:'revolver',aim:1,aimHeading:0},
  run(f,s){for(let i=0;i<30;i++)f.update(s,dt);}},
 {id:'revolver-shot',label:'officer: revolver shot, at the recoil',carry:['revolver'],state:{weapon:'revolver',aim:1,aimHeading:0},
  run(f,s){for(let i=0;i<30;i++)f.update(s,dt);s.shotLeft=.633;for(let i=0;i<6;i++){f.update(s,dt);s.shotLeft-=dt;}}},
 // W4: the dodge roll half way through, and a crouch-walk.
 {id:'roll',label:'roll, 0.45 s in (the dodge window)',state:{weapon:'fists'},
  run(f,s){s.rollTime=s.rollDuration=1.467;for(let i=0;i<27;i++){f.update(s,dt);s.rollTime-=dt;}}},
 {id:'crouch-walk',label:'crouched, creeping with the pistol out',state:{weapon:'pistol',crouching:true,speed:.9},
  run(f,s){for(let i=0;i<40;i++)f.update(s,dt);}},
 // §9ah: the submachine gun. Drawn it is held at the low ready over the legs; aimed it is shouldered
 // (SmgAim) and the spine correction puts the muzzle on the target; a round's recoil climbs it.
 {id:'smg-low',label:'submachine gun drawn, standing (SmgLow over Idle)',state:{weapon:'smg'},run(f,s){for(let i=0;i<30;i++)f.update(s,dt);}},
 {id:'smg-aim',label:'submachine gun aimed, standing (SmgAim)',state:{weapon:'smg',aim:1,aimHeading:0},run(f,s){for(let i=0;i<30;i++)f.update(s,dt);}},
 {id:'smg-aim-walk',label:'submachine gun aimed while walking, target 45° left of the walk',
  state:{weapon:'smg',aim:1,speed:1.4,aimHeading:Math.PI/4,aimTarget:{x:6*Math.sin(Math.PI/4),y:1.35,z:6*Math.cos(Math.PI/4)}},
  target:[6*Math.sin(Math.PI/4),1.35,6*Math.cos(Math.PI/4)],run(f,s){for(let i=0;i<47;i++)f.update(s,dt);}},
 {id:'smg-recoil',label:'submachine gun, a burst at its recoil peak (state.recoil 0.1)',state:{weapon:'smg',aim:1,aimHeading:0},
  run(f,s){for(let i=0;i<30;i++)f.update(s,dt);s.shotLeft=.12;s.recoil=.1;f.update(s,0);}},
 {id:'smg-walk',label:'submachine gun at the low ready, walking',state:{weapon:'smg',speed:1.4},run(f,s){for(let i=0;i<40;i++)f.update(s,dt);}},
 ...(window.WEAPON_POSES??[])
].filter(p=>!only||p.id===only);

const CELL=only?{w:320,h:420}:{w:320,h:240};
const W=CELL.w*4,H=CELL.h*POSES.length;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.setScissorTest(true);document.body.appendChild(renderer.domElement);

function stage(pose){
 const scene=new T.Scene();scene.background=new T.Color(0x20242b);
 scene.add(new T.HemisphereLight(0xcfe0ff,0x3a3a42,1.7));
 const key=new T.DirectionalLight(0xffffff,2.3);key.position.set(3,6,4);scene.add(key);
 const rim=new T.DirectionalLight(0xbfd4ff,1.2);rim.position.set(-4,3,-5);scene.add(rim);
 scene.add(new T.Mesh(new T.PlaneGeometry(20,20).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x555b66})));
 // A target 6 m ahead at chest height, for the aim poses.
 const target=new T.Mesh(new T.SphereGeometry(.08,12,8),new T.MeshBasicMaterial({color:0xffc04a}));target.position.set(...(pose.target??[0,1.35,6]));scene.add(target);
 const figure=createPlayerFigure(asset,pose.carry?{top:0x1d2a44,bottom:0x1a2238}:{top:0xc94d38},{weapons:pose.carry??['pistol','katana','smg']});scene.add(figure.root);
 const state={x:0,y:0,z:0,heading:0,bodyHeading:0,speed:0,alive:true,attackTime:0,attackDuration:0,
  aimTarget:{x:0,y:1.35,z:6},...pose.state};
 for(let i=0;i<50;i++)figure.update(state,dt);
 pose.run(figure,state,scene);
 figure.update(state,0);figure.root.updateMatrixWorld(true);
 // R3: the grip against the palm.
 const hand=figure.root.getObjectByName('hand_r'),palm=new T.Vector3(...PALM).applyMatrix4(hand.matrixWorld),grip=new T.Vector3();
 const held=figure.weapons.grip(grip)?grip.distanceTo(palm):null;
 let line=`${pose.id}: ${pose.label}`;
 if(held!==null)line+=`  | grip-to-palm ${(held*100).toFixed(1)} cm`;
 const m=new T.Vector3(),d=new T.Vector3();
 if(figure.weapons.muzzle(m,d)){
  const to=target.position.clone().sub(m),along=to.dot(d),miss=to.clone().addScaledVector(d,-along).length();
  line+=`  | muzzle ray passes ${(miss*100).toFixed(1)} cm from the target`;
  // The line of fire, drawn out to the target's distance.
  const ray=new T.Mesh(new T.CylinderGeometry(.004,.004,along,5).rotateX(Math.PI/2).translate(0,0,along/2),new T.MeshBasicMaterial({color:0xff5a4a}));
  ray.position.copy(m);ray.lookAt(m.clone().add(d));scene.add(ray);
 }
 return {scene,line};
}

// Front, the player's right, behind, the player's left. The player faces +Z.
const views=[[0,1.45,3.1],[-3.1,1.45,.35],[.25,1.6,-3.1],[3.1,1.45,.35]].map(p=>{
 const c=new T.PerspectiveCamera(30,CELL.w/CELL.h,.05,60);c.position.set(...p);c.lookAt(0,1.05,.35);return c;});
const lines=['front | player\'s right | behind | player\'s left'];
POSES.forEach((pose,row)=>{
 const {scene,line}=stage(pose);
 views.forEach((camera,col)=>{
  const x=col*CELL.w,y=H-(row+1)*CELL.h;
  renderer.setViewport(x,y,CELL.w,CELL.h);renderer.setScissor(x,y,CELL.w,CELL.h);renderer.render(scene,camera);
 });
 lines.push(line);
});
document.getElementById('l').textContent=lines.join('\n');
window.__BENCH__={poses:POSES.map(p=>p.id),lines,calls:renderer.info.render.calls};
document.title='ready';
</script>
