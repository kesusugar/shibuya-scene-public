<!doctype html><meta charset="utf-8"><title>carbench</title>
<!--
  PLAN-POLICE-VOICE-KAZE-DETAIL Step K1/K2: Kaze FR alone, side / front / rear / three-quarter,
  day and night, at 1280x720 -- like punchbench.html benches one citizen, this benches one car.
  Built from the same production path vehiclebench.html uses (scripts/vehicle-visual-source.mjs,
  what npm run bake:playable bakes), so geometry changes show up here without re-baking.
  Serve the repository root and open /qa/gta-upgrade/carbench.html
-->
<style>html,body{margin:0;background:#191d23;overflow:hidden}canvas{display:block}
#l{position:fixed;left:10px;top:8px;color:#e6edf5;font:12px/1.45 monospace;white-space:pre;z-index:9;text-shadow:0 1px 2px #000}
.cap{position:absolute;color:#cfd8e3;font:11px monospace;z-index:9;text-shadow:0 1px 2px #000}
.row{position:absolute;left:6px;color:#8fa0b8;font:10px monospace;z-index:9;text-shadow:0 1px 2px #000}</style>
<div id="l">loading…</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createVehicleAsset} from '/src/player/vehicle-asset.mjs';
const TYPE = 'ownCar';
const W = 1280, H = 720;

const renderer = new T.WebGLRenderer({antialias: true});
renderer.setSize(W, H);
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const pmrem = new T.PMREMGenerator(renderer);
const envTexture = pmrem.fromScene(new RoomEnvironment(), .04).texture;

// The five views the brief asks for (with 'top' folded in for free): a 4x2 grid, day above,
// night below, so both lightings of every angle sit in one 1280x720 frame.
const VIEWS = [
 ['side',      [ 9.5, 0.95,  0.02]],
 ['front',     [ 0.05, 1.25, 7.4 ]],
 ['front 3/4', [ 4.0,  1.7,  5.4 ]],
 ['rear 3/4',  [-4.2,  1.9, -5.2 ]]
];
const cols = VIEWS.length, rows = 2, vw = Math.floor(W / cols), vh = Math.floor(H / rows);
const camera = new T.PerspectiveCamera(32, vw / vh, .05, 120);

function buildScene(night) {
 const scene = new T.Scene();
 scene.background = new T.Color(night ? 0x0b0f16 : 0x2b313a);
 scene.environment = envTexture;
 scene.environmentIntensity = night ? .28 : 1;
 scene.add(new T.HemisphereLight(night ? 0x22304a : 0xcfe0ff, night ? 0x090c12 : 0x3a3f47, night ? .45 : 1.9));
 const key = new T.DirectionalLight(night ? 0x7f96c8 : 0xfff4e2, night ? .5 : 2.6);
 key.position.set(5, 7, 4); key.castShadow = true;
 Object.assign(key.shadow.camera, {left: -6, right: 6, top: 6, bottom: -6, near: .5, far: 30});
 key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0008; key.shadow.normalBias = .03;
 scene.add(key);
 const road = new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2),
  new T.MeshStandardMaterial({color: night ? 0x14181f : 0x3c4149, roughness: .92}));
 road.receiveShadow = true; scene.add(road);
 if (night) {const lamp = new T.PointLight(0xffd9a0, 90, 26, 2); lamp.position.set(-5, 6, 3); scene.add(lamp);}

 const asset = createVehicleAsset(TYPE);
 asset.wheels.frontLeftWheel.rotation.set(1.1, .34, 0, 'YXZ');
 asset.wheels.frontRightWheel.rotation.set(1.1, .34, 0, 'YXZ');
 asset.body.rotation.set(-.018, 0, .016);
 if (night) {
  // The same intensities day-night.mjs ramps traffic-*-front and traffic-*-rear to after dusk.
  asset.root.getObjectByName('traffic-player-front').material.emissiveIntensity = 6;
  asset.setRear(false, 0);
  asset.root.getObjectByName('traffic-player-rear').material.emissiveIntensity = 1.65;
 }
 scene.add(asset.root);
 asset.root.updateMatrixWorld(true);
 return {scene, asset};
}

const day = buildScene(false), night = buildScene(true);
const box = new T.Box3().setFromObject(day.asset.root);
const centre = box.getCenter(new T.Vector3());

for (const [rowIndex, {scene}] of [[0, day], [1, night]]) {
 for (const [i, [label, pos]] of VIEWS.entries()) {
  const cx = i * vw, cy = H - (rowIndex + 1) * vh;
  renderer.setViewport(cx, cy, vw, vh); renderer.setScissor(cx, cy, vw, vh);
  camera.position.set(pos[0], pos[1], pos[2]);
  camera.up.set(0, 1, 0);
  camera.lookAt(centre.x, centre.y * .92, centre.z);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = label;
  cap.style.left = (cx + 8) + 'px'; cap.style.top = (H - cy - vh + 8) + 'px';
  document.body.appendChild(cap);
 }
 const tag = document.createElement('div'); tag.className = 'row'; tag.textContent = rowIndex ? 'NIGHT' : 'DAY';
 tag.style.top = (H - (rowIndex + 1) * vh + vh - 16) + 'px';
 document.body.appendChild(tag);
}

// Cost, the same way vehiclebench.html measures it: one car in an otherwise empty scene.
renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
const probe = new T.PerspectiveCamera(34, W / H, .05, 120); probe.position.set(5, 2, 6); probe.lookAt(0, .7, 0);
day.asset.root.visible = false; renderer.info.reset(); renderer.render(day.scene, probe);
const base = {calls: renderer.info.render.calls, tris: renderer.info.render.triangles};
day.asset.root.visible = true; renderer.info.reset(); renderer.render(day.scene, probe);
const withCar = {calls: renderer.info.render.calls, tris: renderer.info.render.triangles};
let meshes = 0, tris = 0, verts = 0; const mats = new Map();
day.asset.root.traverse(o => {if (o.isMesh) {meshes++; verts += o.geometry.attributes.position.count;
 tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
 mats.set(o.material.uuid, o.name);}});
document.getElementById('l').textContent =
 `${TYPE} (Kaze FR)   ${meshes} meshes  ${verts} verts  ${tris} tris  ${mats.size} materials\n` +
 `bbox ${box.getSize(new T.Vector3()).x.toFixed(2)} w x ${box.getSize(new T.Vector3()).y.toFixed(2)} h x ${box.getSize(new T.Vector3()).z.toFixed(2)} l\n` +
 `cost  +${withCar.calls - base.calls} draw calls  +${withCar.tris - base.tris} triangles (shadow casting on)`;
document.title = 'ready';
</script>
