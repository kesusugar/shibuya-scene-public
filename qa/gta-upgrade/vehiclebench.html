<!doctype html><meta charset="utf-8"><title>vehicle</title>
<!--
  The player vehicle from the angles a driving game shows it at.
  Built from scripts/vehicle-visual-source.mjs, which is what npm run bake:playable bakes, so
  geometry changes show up here without re-baking. Serve the repository root and open
  /qa/gta-upgrade/vehiclebench.html?type=sedan
-->
<style>html,body{margin:0;background:#191d23;overflow:hidden}canvas{display:block}
#l{position:fixed;left:10px;top:8px;color:#e6edf5;font:12px/1.45 monospace;white-space:pre;z-index:9;text-shadow:0 1px 2px #000}
.cap{position:absolute;color:#cfd8e3;font:11px monospace;z-index:9;text-shadow:0 1px 2px #000}</style>
<div id="l">loading…</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createVehicleAsset} from '/src/player/vehicle-asset.mjs';
const P=new URLSearchParams(location.search);
const TYPE=P.get('type')??'sedan';
const NIGHT=P.get('night')==='1';
const W=Number(P.get('w')??1500),H=Number(P.get('h')??820);

const renderer=new T.WebGLRenderer({antialias:true});
renderer.setSize(W,H);renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=NIGHT?1.25:1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene=new T.Scene();
scene.background=new T.Color(NIGHT?0x0b0f16:0x2b313a);
// The game gives the scene an environment map, and car paint and glass are mostly what they
// reflect. Judging either without one flatters boxes and punishes curves, so the bench has one.
const pmrem=new T.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=NIGHT?.28:1;
scene.add(new T.HemisphereLight(NIGHT?0x22304a:0xcfe0ff,NIGHT?0x090c12:0x3a3f47,NIGHT?.45:1.9));
const key=new T.DirectionalLight(NIGHT?0x7f96c8:0xfff4e2,NIGHT?.5:2.6);
key.position.set(5,7,4);key.castShadow=true;
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.5,far:30});
key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0008;key.shadow.normalBias=.03;scene.add(key);
const road=new T.Mesh(new T.PlaneGeometry(40,40).rotateX(-Math.PI/2),
 new T.MeshStandardMaterial({color:NIGHT?0x14181f:0x3c4149,roughness:.92}));
road.receiveShadow=true;scene.add(road);
if(NIGHT){const lamp=new T.PointLight(0xffd9a0,90,26,2);lamp.position.set(-5,6,3);scene.add(lamp);}

const asset=createVehicleAsset(TYPE);
// Turned in and rolling, so the steering and the wheel spin are visible in a still frame.
if(P.get('pose')==='1'){
 asset.wheels.frontLeftWheel.rotation.set(1.1,.34,0,'YXZ');
 asset.wheels.frontRightWheel.rotation.set(1.1,.34,0,'YXZ');
 asset.wheels.rearLeftWheel.rotation.x=1.1;asset.wheels.rearRightWheel.rotation.x=1.1;
 asset.body.rotation.set(-.018,0,.016);
}
if(P.get('brake')==='1')asset.setRear(true,0);
for(const name of (P.get('hide')??'').split(',').filter(Boolean)){
 const o=asset.root.getObjectByName(name);if(o)o.visible=false;
}
if(P.get('mark')==='1')for(const n of ['traffic-player-rear','traffic-player-front'])
 asset.root.getObjectByName(n)?.material.color.set(n.endsWith('rear')?0x00ff00:0xff00ff);
if(NIGHT){
 // The same intensities day-night.mjs ramps traffic-*-front and traffic-*-rear to after dusk.
 asset.root.getObjectByName('traffic-player-front').material.emissiveIntensity=6;
 asset.setRear(P.get('brake')==='1',0);
 asset.root.getObjectByName('traffic-player-rear').material.emissiveIntensity=1.65;
}
scene.add(asset.root);
const visual=asset;

asset.root.updateMatrixWorld(true);
const box=new T.Box3().setFromObject(asset.root);
const size=box.getSize(new T.Vector3()),centre=box.getCenter(new T.Vector3());

// The five views the brief asks for, as a 3x2 grid of scissored viewports.
const ONLY=P.get('view');
const VIEWS=(v=>ONLY?v.filter(x=>x[0]===ONLY):v)([
 ['rear 3/4',  [-4.2,1.9,-5.2]],
 ['front 3/4', [ 4.0,1.7, 5.4]],
 ['side',      [ 9.5,0.95, 0.02]],
 ['front',     [ 0.05,1.25,7.4]],
 ['top',       [ 0.01,9.0,0.02]],
 ['low rear',  [-2.4,0.55,-5.6]]
]);
const cols=ONLY?1:3,rows=ONLY?1:2,vw=Math.floor(W/cols),vh=Math.floor(H/rows);
const camera=new T.PerspectiveCamera(34,vw/vh,.05,120);
for(const [i,[label,pos]] of VIEWS.entries()){
 const cx=(i%cols)*vw,cy=H-(Math.floor(i/cols)+1)*vh;
 renderer.setViewport(cx,cy,vw,vh);renderer.setScissor(cx,cy,vw,vh);
 // Side and front look straight at the car; the rest orbit it.
 camera.position.set(pos[0],pos[1],pos[2]);
 camera.up.set(0,1,0);
 if(label==='top')camera.up.set(0,0,-1);
 camera.lookAt(centre.x,label==='top'?0:centre.y*.92,centre.z);
 camera.updateProjectionMatrix();
 renderer.render(scene,camera);
 const c=document.createElement('div');c.className='cap';c.textContent=label;
 c.style.left=(cx+8)+'px';c.style.top=(H-cy-vh+8)+'px';document.body.appendChild(c);
}
// Cost, measured the way charbench.html measures a citizen: one vehicle in an empty scene,
// read off renderer.info, so the number belongs to the car and not to the city.
renderer.setScissorTest(false);
renderer.setViewport(0,0,W,H);
const probe=new T.PerspectiveCamera(34,W/H,.05,120);probe.position.set(5,2,6);probe.lookAt(0,.7,0);
asset.root.visible=false;renderer.info.reset();renderer.render(scene,probe);
const base={calls:renderer.info.render.calls,tris:renderer.info.render.triangles};
asset.root.visible=true;renderer.info.reset();renderer.render(scene,probe);
const withCar={calls:renderer.info.render.calls,tris:renderer.info.render.triangles};
let meshes=0,tris=0,verts=0;const mats=new Map();
asset.root.traverse(o=>{if(o.isMesh){meshes++;verts+=o.geometry.attributes.position.count;
 tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;
 mats.set(o.material.uuid,o.name);}});
document.getElementById('l').textContent=
 `${TYPE}${NIGHT?' · night':''}   ${meshes} meshes  ${verts} verts  ${tris} tris  ${mats.size} materials\n`+
 `bbox ${size.x.toFixed(2)} w x ${size.y.toFixed(2)} h x ${size.z.toFixed(2)} l   (ground ${box.min.y.toFixed(3)})\n`+
 `cost  +${withCar.calls-base.calls} draw calls  +${withCar.tris-base.tris} triangles (shadow casting on)`;
document.title='ready';
</script>
