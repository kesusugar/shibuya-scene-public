<!doctype html><meta charset="utf-8"><title>stage 1 bench</title>
<style>html,body{margin:0;background:#20242b;overflow:hidden}canvas{display:block}
#l{position:fixed;left:8px;top:8px;color:#dfe6ef;font:11px/1.45 monospace;white-space:pre;z-index:9;text-shadow:0 1px 2px #000}</style>
<div id="l">loading…</div>
<!--
  Roadmap stage 1 on the game's own modules (impact-marks.mjs, hands.mjs through figure.mjs).
  Row 1: what a fight leaves -- holes in a wall and in the pavement, casings bounced and lying,
  muzzle smoke, a dropped magazine, a blood pool spreading (0 s, 3 s, 9 s after the body is down).
  Row 2: a weapon change, pistol to submachine gun, seen from behind the right shoulder: the hand
  goes to the holster, puts the pistol away, reaches over the shoulder to the sling, brings the gun
  up (0, 0.11, 0.21, 0.36, 0.55 s).
  Row 3: the submachine gun's reload from the left front: the hand takes the magazine, pulls it,
  lets it fall, takes a fresh one from the hip, seats it (0.1, 0.25, 0.42, 0.6, 0.8 of 2 s).

  `node qa/gta-upgrade/weaponbench-capture.mjs out.png "" stage1bench.html` saves it.
-->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {humanoidCitizen} from '/src/player/character-asset.mjs';
import {createPlayerFigure} from '/src/player/figure.mjs';
import {createImpactMarks,wallNormal} from '/src/player/impact-marks.mjs';
import {WEAPONS} from '/src/player/weapons.mjs';

const report=await (await fetch('/public/data/character/citizen.json')).json();
const bytes=await (await fetch('/public/data/character/citizen.glb')).arrayBuffer();
const asset=humanoidCitizen(await new Promise((res,rej)=>new GLTFLoader().parse(bytes,'',res,rej)),report);
const dt=1/60,CELL={w:256,h:220},COLS=5,ROWS=3,W=CELL.w*COLS,H=CELL.h*ROWS;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
let lost=false;renderer.domElement.addEventListener('webglcontextlost',()=>{lost=true;});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.setScissorTest(true);document.body.appendChild(renderer.domElement);
const lines=[];
const stage=()=>{const s=new T.Scene();s.background=new T.Color(0x20242b);s.add(new T.HemisphereLight(0xcfe0ff,0x3a3a42,1.7));
 const k=new T.DirectionalLight(0xffffff,2.3);k.position.set(3,6,4);s.add(k);
 const g=new T.Mesh(new T.PlaneGeometry(30,30).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x8a8d92,roughness:.9}));s.add(g);return s;};
const draw=(scene,cam,col,row)=>{const x=col*CELL.w,y=H-(row+1)*CELL.h;renderer.setViewport(x,y,CELL.w,CELL.h);renderer.setScissor(x,y,CELL.w,CELL.h);renderer.render(scene,cam);};

// ---- row 1: marks ----
{const scene=stage();
 const wall=new T.Mesh(new T.BoxGeometry(6,3,.4),new T.MeshStandardMaterial({color:0xb9b2a6,roughness:.95}));wall.position.set(0,1.5,3.2);scene.add(wall);
 const marks=createImpactMarks();scene.add(marks.root);
 const solid=(x,z)=>z>3&&z<3.4&&Math.abs(x)<3;
 for(let i=0;i<9;i++){const p={x:-.5+((i*.37)%1),y:1.1+((i*.53)%.7),z:3.0};marks.hole(p,wallNormal(p,{x:0,y:0,z:1},solid));}
 for(let i=0;i<6;i++)marks.hole({x:-.9+i*.3,y:0,z:1.2+(i%2)*.25},{x:0,y:1,z:0});
 for(let i=0;i<10;i++){marks.casing({x:0,y:1.35,z:0},{x:0,y:-.1,z:1});for(let k=0;k<5;k++)marks.update(dt,{ground:()=>0});}
 marks.magazine({x:.5,y:1.1,z:.4});
 marks.pool(-1.6,0,.6);
 for(let t=0;t<1.5;t+=dt)marks.update(dt,{ground:()=>0});
 const cam=new T.PerspectiveCamera(40,CELL.w/CELL.h,.05,60);
 cam.position.set(0,1.5,1.2);cam.lookAt(0,1.45,3);draw(scene,cam,0,0);
 cam.position.set(.2,1.4,-.9);cam.lookAt(-.1,0,.9);draw(scene,cam,1,0);
 marks.smoke({x:0,y:1.4,z:.3},{x:0,y:0,z:1},3);for(let t=0;t<.25;t+=dt)marks.update(dt,{ground:()=>0});
 cam.position.set(1.2,1.5,.2);cam.lookAt(0,1.45,.45);draw(scene,cam,2,0);
 for(let t=0;t<3;t+=dt)marks.update(dt,{ground:()=>0});
 cam.position.set(-1.6,1.9,-1.1);cam.lookAt(-1.6,0,.6);draw(scene,cam,3,0);
 for(let t=0;t<6;t+=dt)marks.update(dt,{ground:()=>0});
 draw(scene,cam,4,0);
 lines.push('marks: '+JSON.stringify(marks.live));}

// ---- row 2: pistol -> submachine gun ----
{const scene=stage();const figure=createPlayerFigure(asset,{top:0xc94d38},{weapons:['pistol','katana','smg']});scene.add(figure.root);
 const s={x:0,y:0,z:0,speed:0,heading:0,bodyHeading:0,alive:true,attackTime:0,weapon:'pistol'};
 for(let i=0;i<40;i++)figure.update(s,dt);
 s.weapon='smg';
 const cam=new T.PerspectiveCamera(38,CELL.w/CELL.h,.05,60);cam.position.set(-1.5,1.7,-1.9);cam.lookAt(0,1.15,0);
 let t=0;[0,.11,.21,.36,.55].forEach((at,col)=>{while(t<at-1e-6){figure.update(s,dt);t+=dt;}figure.root.updateMatrixWorld(true);draw(scene,cam,col,1);});
 lines.push('draw: '+JSON.stringify(figure.hands.stats)+' shown '+figure.hands.shown);}

// ---- row 3: the reload ----
{const scene=stage();const figure=createPlayerFigure(asset,{top:0x3b6fb6},{weapons:['pistol','katana','smg']});scene.add(figure.root);
 const marks=createImpactMarks();scene.add(marks.root);figure.hands.onDrop=at=>marks.magazine(at);
 const s={x:0,y:0,z:0,speed:0,heading:0,bodyHeading:0,alive:true,attackTime:0,weapon:'smg',reloadLeft:0};
 for(let i=0;i<40;i++)figure.update(s,dt);
 const total=WEAPONS.smg.reloadSeconds;
 const cam=new T.PerspectiveCamera(36,CELL.w/CELL.h,.05,60);cam.position.set(1.4,1.45,1.6);cam.lookAt(0,1.0,0);
 let t=0;[.1,.25,.42,.6,.8].forEach((u,col)=>{while(t<u*total-1e-6){s.reloadLeft=total-t;figure.update(s,dt);marks.update(dt,{ground:()=>0});t+=dt;}figure.root.updateMatrixWorld(true);draw(scene,cam,col,2);});
 lines.push('reload: '+JSON.stringify(figure.hands.stats)+' dropped '+marks.live.mags);}
lines.push('context lost: '+lost);
document.getElementById('l').textContent=lines.join('\n');
window.__BENCH__={lines,lost,calls:renderer.info.render.calls};
document.title='ready';
</script>
